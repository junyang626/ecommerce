{% extends "base.html" %}
{% block title %}注册 - 简易商城{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">
                        <i class="bi bi-person-plus"></i> 用户注册
                    </h3>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="username"
                                   name="username" value="{{ username or '' }}" required autofocus>
                            <div class="form-text">至少 2 个字符</div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">邮箱</label>
                            <input type="email" class="form-control" id="email"
                                   name="email" value="{{ email or '' }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">密码</label>
                            <input type="password" class="form-control"
                                   id="password" name="password" required>
                            <div class="form-text">至少 6 个字符</div>
                        </div>

                        <div class="mb-3">
                            <label for="confirm" class="form-label">确认密码</label>
                            <input type="password" class="form-control"
                                   id="confirm" name="confirm" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-person-check"></i> 注册
                        </button>
                    </form>

                    <hr>
                    <p class="text-center mb-0">
                        已有账号？
                        <a href="{{ url_for('auth.login') }}">立即登录</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
